[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finmath-br"
version = "0.1.0"
description = "Deterministic Brazilian financial math primitives for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Thayron Carlessi" },
]
keywords = [
  "brazil",
  "cdi",
  "fixed-income",
  "finance",
  "financial-math",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "holidays>=0.100,<1",
]

[project.urls]
Homepage = "https://github.com/thayroncarlessi/finmath-br"
Repository = "https://github.com/thayroncarlessi/finmath-br"
Issues = "https://github.com/thayroncarlessi/finmath-br/issues"

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finmath_br"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=finmath_br --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".python"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
